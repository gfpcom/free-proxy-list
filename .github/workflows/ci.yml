name: Validate New Feeds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-new-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Validate newly added feeds
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$EVENT_BEFORE"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "No valid base revision; skipping feed validation."
            exit 0
          fi

          temp_dir=$(mktemp -d)
          trap 'rm -rf "$temp_dir"' EXIT
          mkdir -p "$temp_dir/sources"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            diff_range="$base...$HEAD_SHA"
          else
            diff_range="$base..$HEAD_SHA"
          fi

          git diff --no-ext-diff --unified=0 "$diff_range" -- sources/ | awk -v out="$temp_dir/sources" '
            /^\+\+\+ b\/sources\// {
              path = substr($0, length("+++ b/sources/") + 1)
              next
            }
            /^diff --git / { path = "" }
            /^\+/ && !/^\+\+\+/ && path != "" {
              line = substr($0, 2)
              sub(/^[[:space:]]+/, "", line)
              if (line ~ /^https?:\/\//) {
                print line >> (out "/" path)
              }
            }
          '

          if ! find "$temp_dir/sources" -type f -size +0c -print -quit | grep -q .; then
            echo "No new feed URLs found."
            exit 0
          fi

          go run ./cmd -dir "$temp_dir" -dry-run
